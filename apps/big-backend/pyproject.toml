[project]
name = "big-backend"
version = "0.0.0"
description = "Authoritative FastAPI backend for the BIG operational platform."
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.19.1",
    "cloud-sql-python-connector>=1.22.0",
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=big_backend --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["big_backend"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["big_backend"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "BLE", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
